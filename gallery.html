<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery | MRS Caterings</title>
<meta name="description" content="Reels, posts and stories from MRS Caterings events, updated automatically from Instagram.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/site.css">
</head><body>
<div id="site-header"></div>

<section class="page-hero">
  <div class="bg" style="background-image:url(assets/poster/r19.jpg)"></div>
  <div class="wrap">
    <div class="crumbs"><a href="index.html">Home</a> / Gallery</div>
    <h1>See us <em>in action</em></h1>
    <p class="lead">Real events, real kitchens. New reels, posts and stories appear here as we share them on Instagram.</p>
  </div>
</section>

<section style="padding-top:60px">

    <div class="stories" data-stories></div>

      <button class="on" data-f="all">All</button><button data-f="feast">Feasts</button><button data-f="kitchen">Kitchen</button><button data-f="event">Events</button><button data-f="people">People</button>
    </div>
    <div class="feed-grid" data-feed="all"></div>
    <p style="text-align:center;margin-top:50px"><a class="btn" href="https://www.instagram.com/mrs_caterings/" target="_blank" rel="noopener">Follow @mrs_caterings</a></p>
